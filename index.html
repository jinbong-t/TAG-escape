<style>
/* ==========================================================================
   TAG: 버려지기 전에 — 생활 자원 순환 릴레이 방탈출 (택배 상자 스타일)
   학생: index.html   /   교실 TV: ?tv=반코드   /   교사 대시보드: ?teacher=반코드
   CONFIG.firebase 를 채우면 여러 기기가 실시간 연결됩니다.
   비워 두면 '로컬 테스트 모드' — 같은 브라우저의 탭끼리만 연결됩니다.
   ========================================================================== */
:root{
  --ink:#2b1d12; --ink2:#7a6250; --kraft:#c99a5d; --kraft2:#b8884b; --label:#fffdf7; --label2:#f6efe2;
  --red:#d23a2a; --orange:#ff5a3c; --tape:rgba(255,240,200,.55); --green:#3f9d5d; --green2:#e3f4e6; --blue:#dfeef6; --yellow:#fff3b0; --pink:#ffd9d2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Gowun Dodum','Jua',system-ui,sans-serif;color:var(--ink);overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 2px,transparent 2px 6px),linear-gradient(160deg,#d6ab70,#c99a5d 55%,#b8884b);background-attachment:fixed;min-height:100vh}
h1,h2,h3,.bh{font-family:'Black Han Sans','Jua',sans-serif;font-weight:400;letter-spacing:.3px}
.ju{font-family:'Jua',sans-serif}
.marker{font-family:'Gaegu','Jua',cursive;font-weight:700}
.tape{position:relative;margin:0 -30px 18px;height:44px;background:linear-gradient(var(--tape),rgba(255,236,190,.35));
  border-top:1px dashed rgba(120,80,30,.25);border-bottom:1px dashed rgba(120,80,30,.25);transform:rotate(-1.6deg);overflow:hidden;
  font-family:'Black Han Sans';font-size:14px;letter-spacing:5px;color:rgba(170,45,30,.72);display:flex;align-items:center;gap:34px;white-space:nowrap;padding-left:24px}
button{font-family:'Jua',sans-serif;cursor:pointer;font-size:17px;padding:12px 16px;border:none;border-radius:8px;background:var(--ink);color:var(--label);box-shadow:0 4px 0 #000;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
button:disabled{opacity:.4;cursor:default;transform:none}
button.alt,button.ghost{background:var(--label);color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35)}
button.red{background:var(--red);color:#fff}
button.small{font-size:14px;padding:7px 11px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
button.wide{width:100%}
input,select{font-family:'Jua',sans-serif;font-size:18px;padding:11px 13px;border:2.5px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{outline:3px solid var(--orange);outline-offset:1px}
label{display:block;font-family:'Jua';font-size:12px;letter-spacing:1px;color:var(--ink2);margin:12px 0 5px}
.wrap{max-width:540px;margin:0 auto;padding:16px 14px 30px;position:relative;z-index:1;overflow:hidden}
.wide-wrap{max-width:1320px}
.lbl{background:var(--label);border:2.5px solid var(--ink);border-radius:6px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.pad{padding:14px}
.lbl+.lbl,.mt{margin-top:12px}.mt2{margin-top:20px}
.k{font-family:'Jua';font-size:11px;letter-spacing:1px;color:var(--ink2);text-transform:uppercase}
.row{display:flex;gap:10px}.row>*{flex:1}
.center{text-align:center}
.muted{color:var(--ink2)}
.barcode{height:24px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 7px,transparent 7px 9px,var(--ink) 9px 10px,transparent 10px 13px)}
.stamp{position:absolute;font-family:'Black Han Sans';color:var(--red);border:3px solid var(--red);border-radius:6px;padding:0 8px;transform:rotate(-12deg);letter-spacing:2px;background:rgba(255,255,255,.25)}
.stamp.green{color:var(--green);border-color:var(--green)}
.stamp.in{animation:stampin .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stampin{from{transform:rotate(-12deg) scale(2.6);opacity:0}}
.sticker{display:inline-block;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(2px 3px 0 rgba(0,0,0,.25))}
.pop{animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
.quiver{animation:quiver .25s infinite}
@keyframes quiver{50%{transform:translateX(1.5px)}}
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:300;background:var(--label);border:2.5px solid var(--ink);padding:10px 14px;border-radius:6px;font-family:'Jua';font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:pop .3s;max-width:92vw}
.modebar{text-align:center;font-size:12px;color:rgba(43,29,18,.65);padding:8px 14px 22px}

/* 홈 */
.wow{font-family:'Jua';font-size:clamp(58px,17vw,86px);line-height:1;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-align:center;margin-top:6px;transform:rotate(-3deg)}
.wow span{display:inline-block;animation:bob 2.6s ease-in-out infinite}.wow span:nth-child(2){animation-delay:.3s}
.title-tag{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 2px}
.title-tag b{font-family:'Black Han Sans';font-size:44px;background:var(--ink);color:var(--label);padding:2px 14px;border-radius:4px;letter-spacing:6px}
.title-tag span{font-family:'Black Han Sans';font-size:24px}
.cast{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:10px 0}
.cast>span:nth-child(odd){animation:bob 2.4s ease-in-out infinite}.cast>span:nth-child(even){animation:bob 2.4s .6s ease-in-out infinite}
.waybill{display:grid;grid-template-columns:1fr 1fr}
.waybill>div{padding:8px 10px;border-bottom:2px solid var(--ink)}
.waybill>div:nth-child(odd){border-right:2px solid var(--ink)}
.waybill .v{font-family:'Jua';font-size:16px}

/* HUD */
.hud{display:grid;grid-template-columns:104px 1fr;margin-bottom:10px;overflow:visible}
.hud .pic{border-right:2.5px solid var(--ink);display:grid;place-items:center;background:var(--label2);padding:6px 0}
.hud .info{padding:8px 10px}
.hud .nm{font-family:'Black Han Sans';font-size:24px;line-height:1.05}
.gauge{height:13px;border:2px solid var(--ink);border-radius:3px;margin-top:4px;background:#fff;overflow:hidden}
.gauge b{display:block;height:100%;background:repeating-linear-gradient(90deg,#4cb36a 0 6px,#5fc47b 6px 12px);transition:width .4s}
.gauge.low b{background:repeating-linear-gradient(90deg,#ff5a3c 0 6px,#ff7a5f 6px 12px);animation:blink .8s infinite}
@keyframes blink{50%{opacity:.45}}
.gl{display:flex;justify-content:space-between;font-family:'Jua';font-size:11px;color:var(--ink2);margin-top:2px}
.track{display:flex;align-items:center;margin:6px 4px 0}
.track i{flex:1;height:4px;background:var(--ink);opacity:.25}
.track b{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:var(--label);display:grid;place-items:center;font-size:11px;font-family:'Jua'}
.track b.on{background:var(--ink);color:var(--label)}.track b.now{background:var(--orange);color:#fff;box-shadow:0 0 0 4px rgba(255,90,60,.3)}
.track-l{display:flex;justify-content:space-between;font-family:'Jua';font-size:11px;margin:3px 0 10px}
.team{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seatchip{flex:1;min-width:76px;background:var(--label);border:2px solid var(--ink);border-radius:5px;padding:4px 7px;font-family:'Jua';font-size:12.5px;display:flex;align-items:center;gap:5px}
.seatchip.me{background:var(--yellow)}
.seatchip .ok{margin-left:auto;color:var(--green)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;min-width:0;padding:8px 3px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.tabs button i.ck{position:absolute;right:-2px;top:-2px;font-style:normal;font-size:11px;background:var(--green);color:#fff;border-radius:0 6px 0 6px;padding:0 4px;line-height:16px}
.tabs{overflow:visible}
.tabs button.sel{background:var(--orange);color:#fff}
.tabs button.fin{opacity:.7}
@media (max-width:400px){ .tabs{gap:4px} .tabs button{font-size:12.5px;padding:8px 1px;letter-spacing:-.5px} }

/* 장면 */
.scene .head{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:2.5px dashed var(--ink)}
.scene .head h3{font-size:23px}
.scene .head .addr{font-family:'Jua';font-size:11px;color:var(--ink2);letter-spacing:1px}
.scene .head .stp{margin-left:auto;font-family:'Jua';font-size:12px;border:2px solid var(--ink);border-radius:4px;padding:1px 6px}
.scene .body{padding:14px}
.say{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}
.say .av{flex:0 0 42px;height:42px;background:var(--yellow);border:2px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-family:'Jua';font-size:10px;transform:rotate(-6deg)}
.say .tx{flex:1;font-family:'Gaegu','Jua',cursive;font-weight:700;font-size:19px;line-height:1.28;min-height:40px}
.q{font-family:'Jua';font-size:18px;line-height:1.45;margin:2px 0 12px}
.q b{background:linear-gradient(transparent 55%,#ffd27a 55%);font-weight:400}
.opts{display:grid;gap:9px}
.opt{text-align:left;background:#fff;color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25);font-family:'Gowun Dodum';font-weight:700;font-size:15.5px;line-height:1.4}
.opt.okk{background:var(--green2)}.opt.bad{background:#fbe3dd;opacity:.6}
.opt.sel{background:var(--blue);outline:3px dashed var(--ink);outline-offset:-7px}
.fb{margin-top:12px;padding:10px 12px;border:2.5px solid var(--ink);border-radius:5px;font-size:15px;line-height:1.55;display:none;position:relative}
.fb b{font-family:'Jua';font-weight:400}
.fb.show{display:block;animation:pop .3s}
.fb.ok{background:var(--green2)}.fb.no{background:#fbe3dd}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.info{background:var(--label2);border:2px dashed var(--ink);border-radius:5px;padding:11px 12px;font-size:15px;line-height:1.6;margin-bottom:12px}
.info b{font-family:'Jua';font-weight:400}
.poster{background:#fff;border:2.5px solid var(--ink);padding:10px 14px;text-align:center;transform:rotate(-2deg);margin:6px auto 14px;font-family:'Jua';font-size:15px;max-width:280px;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.poster small{display:block;font-family:'Gowun Dodum';font-size:12px;color:var(--ink2)}
.poster.torn-r{clip-path:polygon(0 0,82% 0,74% 18%,86% 36%,72% 55%,84% 74%,76% 100%,0 100%)}
.poster.torn-l{clip-path:polygon(18% 0,100% 0,100% 100%,22% 100%,12% 80%,26% 60%,14% 40%,24% 20%)}
.route{font-family:'Black Han Sans';font-size:21px;background:#fff;border:2.5px solid var(--ink);border-radius:5px;padding:10px 12px;line-height:1.5}
.route s{color:var(--red)}

/* 잠금장치 */
.lock{background:#e9d3ad;border:2.5px solid var(--ink);border-radius:14px;padding:14px;max-width:330px;margin:0 auto;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.wheels{display:flex;gap:7px;justify-content:center;margin-bottom:12px}
.wheels input{width:56px;height:66px;text-align:center;font-family:'Black Han Sans';font-size:34px;text-transform:uppercase;padding:0;border-radius:6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys button{background:#fff;color:var(--ink);border:2px solid var(--ink);font-size:21px;padding:8px 0;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.keys button.ent{background:var(--ink);color:#fff}
.screen{background:#122017;color:#7dffb0;font-family:'Black Han Sans';font-size:34px;letter-spacing:12px;text-align:center;border-radius:6px;padding:4px 0;margin-bottom:10px;min-height:54px;border:2.5px solid var(--ink)}
.seq{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;margin:4px 0 10px}
.seq span{background:var(--blue);border:2px solid var(--ink);border-radius:4px;padding:3px 8px;font-family:'Jua';font-size:13px}

/* 세탁기 */
.washer{width:140px;height:156px;margin:0 auto 14px;background:#fff;border:3px solid var(--ink);border-radius:14px;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.washer::before{content:"";position:absolute;left:10px;right:10px;top:9px;height:14px;border:2px solid var(--ink);border-radius:4px;background:var(--yellow)}
.drum{position:absolute;left:20px;top:36px;width:94px;height:94px;border-radius:50%;background:#bfe0f5;border:4px solid var(--ink);overflow:hidden;display:grid;place-items:center}
.drum.spin span{animation:spin .7s linear infinite;display:inline-block}.drum.fast span{animation-duration:.22s}
@keyframes spin{to{transform:rotate(360deg)}}

/* 돋보기 */
.lensbox{position:relative;border:2.5px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;touch-action:none;cursor:none}
.lensbox .lensbase{padding:10px}
.lens{position:absolute;width:130px;height:130px;border-radius:50%;border:5px solid var(--ink);overflow:hidden;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.35);background:#fff;left:-200px;top:0}
.lens::after{content:"";position:absolute;right:-26px;bottom:-26px;width:40px;height:14px;background:var(--ink);transform:rotate(45deg)}
.lens .lensin{position:absolute;left:0;top:0;transform-origin:0 0;width:100%}
.prods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.prod{border:2px solid var(--ink);border-radius:5px;padding:6px 2px 4px;text-align:center;background:var(--label2);cursor:pointer}
.prod .sil{font-size:30px;filter:grayscale(1) contrast(.7) opacity(.8)}
.prod .mk{display:inline-block;font-family:'Jua';font-size:5px;line-height:1.1;border:.6px solid var(--ink);border-radius:2px;padding:1px 2px;margin-top:2px;background:#fff}
.prod.pick{outline:3px solid var(--orange)}

/* 파이프 */
.pipewrap{display:flex;align-items:center;justify-content:center;gap:4px}
.pipes{display:grid;grid-template-columns:repeat(4,64px);grid-template-rows:repeat(4,64px);gap:3px;background:var(--ink);padding:3px;border-radius:6px}
.tile{background:#efe6d6;position:relative;cursor:pointer;display:grid;place-items:center}
.tile svg{position:absolute;inset:0;transition:transform .2s}
.tile .ch{position:relative;font-family:'Black Han Sans';font-size:17px;color:rgba(43,29,18,.35);z-index:2}
.tile.wet{background:#d7ecf7}.tile.wet .ch{color:var(--ink)}
.side{display:flex;flex-direction:column;gap:3px;font-family:'Jua';font-size:11px;text-align:center}
.side div{height:64px;display:grid;place-items:center;width:48px;border-radius:5px}
.side .src{background:#7b6a9a;color:#fff}.side .river{background:#bfe0f5}.side .tank{background:#9ed8a8}

/* 지도 경로 */
.mapbox{border:2.5px solid var(--ink);border-radius:6px;background:#eef6e9;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .node{cursor:pointer}
.pathbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:10px 0;font-family:'Jua';font-size:14px;min-height:30px}
.pathbar span{background:var(--yellow);border:2px solid var(--ink);border-radius:4px;padding:2px 7px}

/* 저울 */
.scale{position:relative;height:150px;margin-bottom:8px}
.beam{position:absolute;left:50%;top:40px;width:260px;margin-left:-130px;height:8px;background:var(--ink);border-radius:4px;transition:transform .4s;transform-origin:50% 50%}
.pan{position:absolute;top:8px;width:110px;min-height:52px;border:2.5px solid var(--ink);border-top:none;border-radius:0 0 50px 50px;background:#fff;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;padding:4px;font-size:20px}
.pan.l{left:-30px}.pan.r{right:-30px;font-family:'Jua';font-size:14px;align-items:center}
.post{position:absolute;left:50%;top:44px;width:10px;height:96px;margin-left:-5px;background:var(--ink)}
.base{position:absolute;left:50%;bottom:0;width:120px;height:12px;margin-left:-60px;background:var(--ink);border-radius:4px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:#fff;border:2.5px solid var(--ink);border-radius:5px;padding:8px;cursor:pointer;font-family:'Jua';font-size:14px;line-height:1.35}
.item small{display:block;font-family:'Gowun Dodum';font-size:12px;color:var(--ink2)}
.item.on{background:var(--yellow)}
.sum{display:flex;justify-content:space-between;font-family:'Jua';font-size:15px;margin:10px 0}
.sum .over{color:var(--red)}

/* 물물교환 */
.posts{display:grid;gap:8px}
.post-card{background:#fff;border:2.5px solid var(--ink);border-radius:5px;padding:9px 11px;cursor:pointer;font-size:14.5px;line-height:1.45;position:relative}
.post-card b{font-family:'Jua';font-weight:400}
.post-card.used{opacity:.45;cursor:default}
.post-card .who{font-family:'Jua';font-size:12px;color:var(--ink2)}
.hand{display:flex;align-items:center;gap:8px;background:var(--yellow);border:2.5px solid var(--ink);border-radius:5px;padding:8px 10px;font-family:'Jua';margin-bottom:10px}
.hand .chain{margin-left:auto;font-size:13px;color:var(--ink2)}

/* 손전등 */
.dark{position:relative;height:250px;border:2.5px solid var(--ink);border-radius:6px;overflow:hidden;background:#cfd8de;touch-action:none;--x:-200px;--y:-200px}
.dark .it{position:absolute;font-size:34px}
.dark .hl{position:absolute;font-family:'Black Han Sans';font-size:26px;color:#e8f6ff;cursor:pointer;text-shadow:0 0 6px rgba(120,200,255,.9);padding:4px}
.dark .hl.got{color:var(--orange);text-shadow:none}
.dark.kitchen{height:auto;aspect-ratio:4/3;background:#1a1d24;cursor:crosshair}
.dark.kitchen .ksvg{display:block;width:100%;height:100%}
.dark .hl.hit{width:12%;height:15%;transform:translate(-50%,-50%);padding:0;border-radius:50%;z-index:1}
.dark.kitchen .shade{z-index:3}
.dark.kitchen.lit .shade{animation:liton .8s forwards}
.dark.kitchen.lit{cursor:default}
.dark.kitchen.lit::after{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 0,rgba(255,240,180,.35),transparent 70%);animation:fadein .8s .3s both}
@keyframes liton{0%{opacity:1}15%{opacity:.2}25%{opacity:.9}40%{opacity:.1}50%{opacity:.6}100%{opacity:0}}
.dark .hl.hit.got{box-shadow:0 0 0 3px var(--orange);background:rgba(255,90,60,.12)}
.ksvg .kl{font-family:'Black Han Sans';transition:fill .3s}
.ksvg .kl.got{fill:var(--orange);stroke:#fff;stroke-width:1.5;paint-order:stroke fill}
.dark.kitchen .shade{background:radial-gradient(circle 70px at var(--x) var(--y),rgba(0,0,0,0) 0,rgba(0,0,0,0) 58px,rgba(8,10,16,.97) 76px)}
.dark .shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 64px at var(--x) var(--y),rgba(0,0,0,0) 0,rgba(0,0,0,0) 54px,rgba(8,10,16,.95) 70px)}
.found{display:flex;gap:6px;justify-content:center;margin:10px 0}
.found span{width:38px;height:42px;border:2.5px dashed var(--ink);border-radius:4px;display:grid;place-items:center;font-family:'Black Han Sans';font-size:22px;background:#fff}
.found span.g{border-style:solid;background:var(--yellow)}

/* 멀티탭 */
.strip{display:flex;align-items:stretch;background:#f3f3ef;border:2.5px solid var(--ink);border-radius:12px;padding:8px 6px 8px 4px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.strip .plug{writing-mode:vertical-lr;display:grid;place-items:center;font-size:18px;padding:0 2px;border-right:2px dashed #0003;margin-right:4px}
.socks{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;position:relative}
.socks::before{content:"";position:absolute;left:8%;right:8%;top:17px;height:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 10px);opacity:.35}
.sk{position:relative;height:96px;border:2.5px solid var(--ink);border-radius:9px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:6px 0 0;color:var(--ink);font-size:11px;box-shadow:0 3px 0 rgba(0,0,0,.3);font-family:'Jua'}
.sk i{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);background:#d9d4cc;position:relative;z-index:1}
.sk em{font-style:normal;font-size:24px;filter:grayscale(1);opacity:.5}
.sk span{white-space:nowrap;letter-spacing:-.5px}
.sk.on{background:#fff2e8}.sk.on i{background:var(--orange);box-shadow:0 0 12px var(--orange)}.sk.on em{filter:none;opacity:1}
.sk.fl{animation:skfl .35s}
@keyframes skfl{40%{transform:translateY(-6px);box-shadow:0 0 0 4px rgba(255,90,60,.45)}}
.sk.tip{outline:4px solid #3f9dff;outline-offset:2px;animation:tip .8s infinite}
.sk.tip::after{content:"여기!";position:absolute;bottom:-22px;font-size:12px;color:#fff;background:#3f9dff;border-radius:4px;padding:0 5px}
@keyframes tip{50%{transform:translateY(-4px)}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{height:66px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Jua';font-size:12.5px;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25);padding:0}
.sw i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);margin-bottom:4px;background:#fff}
.sw.on i{background:var(--orange);box-shadow:0 0 10px var(--orange)}
.sw.on{background:#fff5ee}
.watt{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-family:'Jua'}
.watt b{font-family:'Black Han Sans';font-size:22px;color:var(--red)}
.wbar{height:15px;border:2.5px solid var(--ink);border-radius:3px;background:#fff;overflow:hidden}
.wbar b{display:block;height:100%;background:var(--orange);transition:width .3s}

/* 슬라이딩 */
.fridge{position:relative;width:290px;height:234px;margin:0 auto;background:var(--blue);border:2.5px solid var(--ink);border-radius:8px}
.fridge .door{position:absolute;right:-30px;top:58px;font-family:'Black Han Sans';background:var(--orange);color:#fff;padding:1px 5px;border:2.5px solid var(--ink);border-radius:4px;font-size:13px}
.blk{position:absolute;border:2.5px solid var(--ink);border-radius:7px;display:grid;place-items:center;font-family:'Jua';font-size:13px;cursor:pointer;transition:left .18s,top .18s;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.blk.selb{outline:3px solid var(--orange);outline-offset:2px}
.arrows{display:flex;justify-content:center;gap:8px;margin-top:10px;min-height:46px}
.arrows button{width:64px;font-size:20px;padding:8px}

/* 문지르기 */
.scr{position:relative;width:100%;height:220px;border:2.5px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff;touch-action:none}
.scr .under{position:absolute;inset:0;display:grid;place-items:center}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.scr .pct{position:absolute;right:6px;top:6px;font-family:'Jua';font-size:12px;background:var(--label);border:2px solid var(--ink);border-radius:4px;padding:1px 6px;z-index:3}

/* 조각 맞추기 */
.bag{position:relative;height:210px;border:2.5px solid var(--ink);border-radius:6px;background:var(--label2);margin-bottom:10px}
.slot{position:absolute;border:2.5px dashed var(--ink2);border-radius:8px;display:grid;place-items:center;font-family:'Jua';font-size:12px;color:var(--ink2);cursor:pointer;text-align:center;line-height:1.2;padding:2px}
.slot.full{border:2.5px solid var(--ink);background:#7c9cc8;color:#fff}
.slot.hot{box-shadow:0 0 0 4px rgba(255,90,60,.4)}
.tray{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.piece{background:#fff;border:2.5px solid var(--ink);border-radius:5px;padding:8px;cursor:pointer;font-family:'Jua';font-size:13.5px;display:flex;align-items:center;gap:6px}
.piece.selp{background:var(--yellow);outline:3px solid var(--orange)}
.piece.used{opacity:.35;cursor:default}

/* 분해 */
.parts{display:grid;gap:8px}
.part{background:#fff;border:2.5px solid var(--ink);border-radius:5px;padding:9px 10px;display:flex;align-items:center;gap:8px;font-family:'Jua';font-size:14px;flex-wrap:wrap}
.part .screws{margin-left:auto;display:flex;gap:3px}
.part .screw{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);background:#d9d9d9;display:grid;place-items:center;font-size:14px;cursor:pointer;padding:0;color:var(--ink);box-shadow:none}
.part .screw.out{opacity:.25;animation:spin .4s}
.part .bins{width:100%;display:flex;gap:6px;margin-top:6px}
.part .bins button{flex:1;font-size:13px;padding:6px 4px}
.part.done{background:var(--green2)}

/* 단서 */
.cluebar{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--yellow);border:2.5px solid var(--ink);border-radius:6px;padding:9px 10px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);animation:pop .4s both,cluepulse 1.6s 1s infinite}
.cluebar .ci{font-size:28px;animation:bob 1.4s infinite}
.cluebar .ct{flex:1;line-height:1.25}.cluebar .ct b{font-family:'Black Han Sans';font-weight:400;font-size:16px;display:block}.cluebar .ct small{font-size:12.5px;color:var(--ink2)}
.cluebar button{flex:none;background:var(--red);color:#fff}
@keyframes cluepulse{50%{box-shadow:0 3px 0 rgba(0,0,0,.25),0 0 0 6px rgba(255,90,60,.35)}}
.wrap:has(.fab){padding-bottom:96px}
.fab{position:fixed;right:14px;bottom:18px;z-index:90;background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:11px 16px;font-size:16px;box-shadow:0 4px 0 #000;animation:cluepulse 1.6s infinite}
.fab i{font-style:normal;background:#fff;color:var(--red);border-radius:99px;padding:0 7px;margin-left:6px;font-size:13px}
.cluemodal .box{max-height:92vh;overflow:auto}
.cluemodal .clue{transform:none;margin-top:16px}
.clue{margin-top:14px;background:#fff7d6;border:2.5px solid var(--ink);border-radius:5px;padding:12px;position:relative;transform:rotate(-.6deg)}
.clue::before{content:"";position:absolute;left:50%;top:-12px;width:90px;height:22px;margin-left:-45px;background:var(--tape);transform:rotate(-3deg);border:1px dashed rgba(120,80,30,.3)}
.clue h4{font-family:'Black Han Sans';font-weight:400;font-size:17px}
.clue .use{font-size:13px;background:#fff;border:2px solid var(--ink);border-radius:4px;padding:3px 8px;margin:4px 0 2px;display:inline-block}
.info ol.steps{margin:8px 0 0 20px;line-height:1.8;font-size:15px}
.clue .why{font-size:13px;color:var(--ink2);margin:2px 0 10px}

/* 단톡방 */
.phone{width:286px;margin:0 auto;background:#c5d8e6;border-radius:26px;padding:14px 10px 12px;border:5px solid var(--ink)}
.phone .top{font-family:'Jua';font-size:13px;text-align:center;margin-bottom:3px}
.phone .legend{font-size:10.5px;color:#4e6474;text-align:center;margin-bottom:8px}
.chatbox{display:flex;flex-direction:column;gap:5px}
.chatbox .day{text-align:center;font-size:10.5px;color:#fff;background:#0002;border-radius:99px;padding:2px 0;margin:8px 34px 4px}
.crow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-items:center}
.bub{font-size:12.5px;line-height:1.3;padding:5px 8px;border-radius:10px;color:#222;min-height:28px;display:flex;align-items:center}
.bub.L{background:#fff}.bub.R{background:#ffec5c;justify-content:flex-end;text-align:right}
.bub.w1{white-space:nowrap;overflow:hidden;justify-content:center;text-align:center;font-size:12px;padding:5px 3px}
.bub.w2{grid-column:1/3}.bub.w3{grid-column:1/4}
.bub.c1{grid-column:1}.bub.c3{grid-column:3}
.mission{background:#fff;border:2.5px solid var(--ink);border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;margin-bottom:10px}.mission b{font-family:'Jua';font-weight:400;color:var(--red)}.mission span{font-family:'Jua';color:var(--ink2)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cgrid.shake{animation:shake .5s}
.ccard{position:relative;background:#c5d8e6;border:3px solid var(--ink);border-radius:14px;padding:6px 5px 8px;cursor:default;transition:transform .15s;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.ccard:active{transform:scale(.97)}
.ccard.picked{background:#dbe8c9}
.ccard .cday{text-align:center;font-family:'Jua';font-size:12px;color:#fff;background:#0003;border-radius:99px;margin:0 10px 6px;padding:1px 0}
.ccard .chatbox{gap:3px}.ccard .crow{gap:3px}
.ccard .bub{font-size:10.5px;min-height:22px;padding:3px 5px;border-radius:7px;line-height:1.25}
.ccard .bub.w1{font-size:10px;padding:3px 2px;white-space:normal;word-break:keep-all;overflow:visible;line-height:1.15}
button.locked{opacity:.75;border-style:dashed}button.locked small{font-size:11px;display:block}
.cgrid.far4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ccard.farc{cursor:default;padding:8px 8px 10px}
.ccard.farc .cday{margin:0 0 8px;font-size:11px}
.ccard .chatbox.shape{gap:4px}.ccard .chatbox.shape .crow{gap:4px}
.ccard .chatbox.shape .bub{height:14px;min-height:0;padding:0;font-size:0;border-radius:4px;background:var(--ink)}
.ccard .chatbox.shape .bub.R{background:#8a6d1e}
.ccard .num{position:absolute;left:-8px;top:-10px;z-index:2;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:'Black Han Sans';font-weight:400;font-size:16px;animation:stampin .3s both}
.phone.wide{width:100%;max-width:360px}
.far{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 2px}
.farcell{background:#fff;border:2px dashed #0002;border-radius:8px;padding:8px 6px 4px;text-align:center}
.farcell small{display:block;font-size:10px;color:#4e6474;margin-top:4px}
.chatbox.shape{width:100%;margin:0 auto;gap:3px;padding:0}
.chatbox.shape .crow{gap:3px}
.chatbox.shape .bub{font-size:0;min-height:0;height:12px;padding:0;border-radius:2px;background:var(--ink);animation:pop .4s both}
.shapecap{font-family:'Jua';font-size:12px;color:#4e6474;text-align:center;margin-top:6px}
.phone.shapeon{background:#eef4f8}
.clock88{color:#ff4d3d;background:#1b120c;display:inline-block;padding:0 6px;border-radius:4px;letter-spacing:2px;font-family:'Black Han Sans';font-size:14px;animation:blink 1s infinite}

/* 집게 */
.claw{position:fixed;right:4px;top:0;width:96px;z-index:80;pointer-events:none;overflow:visible;transform:translateY(-110%);transition:transform .5s,top .9s cubic-bezier(.3,1.6,.5,1)}
.claw.shake2{animation:clawjolt .5s}
@keyframes clawjolt{30%{transform:translateY(-110%) rotate(6deg)}60%{transform:translateY(-110%) rotate(-5deg)}}
.claw.drop{animation:clawdrop 1.4s ease-in-out}
.claw.hover{transform:translateY(-58%);animation:clawhover 3s ease-in-out infinite}
@keyframes clawdrop{0%{transform:translateY(-110%)}45%{transform:translateY(-18%)}60%{transform:translateY(-26%)}100%{transform:translateY(-110%)}}
@keyframes clawhover{50%{transform:translateY(-50%) rotate(3deg)}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:70;transition:box-shadow .4s}
.vignette.on{box-shadow:inset 0 0 120px 30px rgba(210,58,42,.45)}

/* 오프닝 */
.intro{position:fixed;inset:0;z-index:300;overflow:hidden;background:radial-gradient(circle at 50% 40%,#e9c48d,#c99a5d 60%,#8f6534);transition:opacity .45s}
.intro.out{opacity:0;pointer-events:none}
.intro::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 4px);animation:fadein 1s}
.intro .stage{position:absolute;left:50%;top:50%;width:380px;height:680px;transform-origin:50% 50%}
.intro .stage>*{position:absolute}
.i-skip{position:absolute;right:12px;top:12px;z-index:5;font-size:13px;padding:7px 12px;background:rgba(43,29,18,.85)}
.i-cap{left:0;right:0;top:40px;text-align:center;animation:icap 3.2s .1s both}

var PIPE_BASE={I:[0,2],L:[0,1],T:[0,1,2]};
function pipeDirs(t){ return PIPE_BASE[t.t].map(function(d){ return (d+t.rot)%4; }); }
function pipeSvg(t){ var p={I:'M50 0V100',L:'M50 0V50H100',T:'M50 0V100M50 50H100'}[t.t];
  return '<svg viewBox="0 0 100 100" style="transform:rotate('+(t.rot*90)+'deg)"><path d="'+p+'" stroke="#2b1d12" stroke-width="30" fill="none" stroke-linecap="square"/><path d="'+p+'" class="water" stroke="'+(t.wet?'#4aa3df':'#bba88e')+'" stroke-width="18" fill="none" stroke-linecap="square"/></svg>'; }
function newPipes(){ var G=[], types='ILTILTLITLIT', k=0, ch={'1,1':'S','2,1':'L','2,2':'O','2,3':'W','0,0':'F','0,2':'A','3,1':'S','3,3':'T'};
  for(var r=0;r<4;r++){ G.push([]); for(var c=0;c<4;c++){ G[r].push({t:types[(r*4+c+3)%types.length], rot:Math.floor(Math.random()*4), ch:ch[r+','+c]||''}); } }
  G[1][0].t='I'; G[1][1].t='L'; G[2][1].t='L'; G[2][2].t='I'; G[2][3].t='I';
  if(pipeFlow(G).ok){ G[2][2].rot=0; G[1][1].rot=1; } return G; }
function pipeFlow(G){ var D=[[-1,0],[0,1],[1,0],[0,-1]]; G.forEach(function(row){ row.forEach(function(t){ t.wet=false; }); });
  var start=G[1][0]; if(pipeDirs(start).indexOf(3)<0) return {ok:false};
  var st=[[1,0]], seen={'1,0':1}; start.wet=true; var ok=false;
  while(st.length){ var cur=st.pop(), t=G[cur[0]][cur[1]];
    pipeDirs(t).forEach(function(d){ var nr=cur[0]+D[d][0], nc=cur[1]+D[d][1];
      if(cur[0]===2&&cur[1]===3&&d===1) ok=true;
      if(nr<0||nr>3||nc<0||nc>3) return; var n=G[nr][nc]; if(pipeDirs(n).indexOf((d+2)%4)<0) return;
      if(!seen[nr+','+nc]){ seen[nr+','+nc]=1; n.wet=true; st.push([nr,nc]); } }); }
  return {ok:ok}; }
PZ.pipes = { html:function(st,c){ c.L.pipes=c.L.pipes||newPipes(); pipeFlow(c.L.pipes);

    draw(); c.L.cheat=function(){ G[1][0].rot=1; G[1][1].rot=2; G[2][1].rot=0; G[2][2].rot=1; G[2][3].rot=1; pipeFlow(G); draw(); api.ok(st.fb); }; } };

function routeBest(st){ var best=Infinity; var adj={}; st.edges.forEach(function(e){ (adj[e[0]]=adj[e[0]]||[]).push([e[1],e[2]]); (adj[e[1]]=adj[e[1]]||[]).push([e[0],e[2]]); });
  var end=st.nodes.filter(function(n){return n.end;})[0].id;
  function dfs(n,d,seen){ if(d>=best) return; if(n===end){ best=d; return; } (adj[n]||[]).forEach(function(x){ if(!seen[x[0]]){ seen[x[0]]=1; dfs(x[0],d+x[1],seen); delete seen[x[0]]; } }); }
  st.nodes.filter(function(n){return n.start;}).forEach(function(s){ var seen={}; seen[s.id]=1; dfs(s.id,0,seen); }); return best; }
function edgeW(st,a,b){ var w=null; st.edges.forEach(function(e){ if((e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a)) w=e[2]; }); return w; }
PZ.route = { html:function(st){ return '<div class="mapbox"><svg viewBox="0 0 340 215" id="map"></svg></div><div class="pathbar" id="pbar"></div><div class="row"><button class="alt small" id="bRst">↺ 다시 긋기</button><button class="small" id="bGo">🚚 이 경로로 배송</button></div>'; },
  bind:function(st,c,api){ var path=[]; var N={}; st.nodes.forEach(function(n){ N[n.id]=n; }); var best=routeBest(st);
    function tot(){ var s=0; for(var i=1;i<path.length;i++) s+=edgeW(st,path[i-1],path[i]); return s; }
    function inPath(a,b){ for(var i=1;i<path.length;i++){ if((path[i-1]===a&&path[i]===b)||(path[i-1]===b&&path[i]===a)) return true; } return false; }
    function draw(){ var s='<rect width="340" height="215" fill="#eef6e9"/><path d="M0 190Q90 160 170 190T340 180V215H0Z" fill="#dcebcf"/>';

function clone(o){ return o==null?o:JSON.parse(JSON.stringify(o)); }
var LocalStore = {
  key:'tag_local_db_v2', subs:[], ch:null, mode:'local',
  init:function(){ var self=this;
    try{ this.ch=new BroadcastChannel('tag_bus2'); this.ch.onmessage=function(){ self.fire(); }; }catch(e){}
    window.addEventListener('storage', function(e){ if(e.key===self.key) self.fire(); });
    return Promise.resolve(); },
  read:function(){ try{ return JSON.parse(localStorage.getItem(this.key)) || {rooms:{}}; }catch(e){ return {rooms:{}}; } },
  write:function(db){ try{ localStorage.setItem(this.key, JSON.stringify(db)); }catch(e){} if(this.ch) try{ this.ch.postMessage(1); }catch(e){} this.fire(); },
  fire:function(){ this.subs.slice().forEach(function(f){ try{ f(); }catch(e){ console.error(e); } }); },
  room:function(db,cls){ db.rooms[cls]=db.rooms[cls]||{teams:{},events:[]}; return db.rooms[cls]; },
  updateTeam:function(cls,id,fn){ var db=this.read(), r=this.room(db,cls); var nt=fn(clone(r.teams[id]||null));
    if(nt===undefined) return Promise.resolve(r.teams[id]||null);
    if(nt===null) delete r.teams[id]; else r.teams[id]=storeDoc(nt); this.write(db); return Promise.resolve(nt); },
  pushEvent:function(cls,text,kind){ var db=this.read(), r=this.room(db,cls); r.events.push({ts:Date.now(),text:text,kind:kind||''}); r.events=r.events.slice(-40); this.write(db); return Promise.resolve(); },
  watchTeam:function(cls,id,cb){ var self=this; var f=function(){ var r=self.read().rooms[cls]; cb(r&&r.teams[id]?r.teams[id]:null); };
    this.subs.push(f); f(); return function(){ self.subs=self.subs.filter(function(x){return x!==f;}); }; },
  watchRoom:function(cls,cb){ var self=this; var f=function(){ cb(clone(self.read().rooms[cls]||{teams:{},events:[]})); };
    this.subs.push(f); f(); return function(){ self.subs=self.subs.filter(function(x){return x!==f;}); }; },
  clearRoom:function(cls){ var db=this.read(); delete db.rooms[cls]; this.write(db); return Promise.resolve(); }
};
/* 저장용 사본: 일회성 이벤트(_ev)는 빼고, undefined 값은 지워서 Firestore가 거부하지 않게 */
function storeDoc(nt){ var c=JSON.parse(JSON.stringify(nt)); delete c._ev; return c; }
var FireStore = {
  mode:'firebase', db:null,
  init:function(){ var v='10.12.2', self=this;
    function load(s){ return new Promise(function(res,rej){ var e=document.createElement('script'); e.src=s; e.onload=res; e.onerror=rej; document.head.appendChild(e); }); }
    return load('https://www.gstatic.com/firebasejs/'+v+'/firebase-app-compat.js')
      .then(function(){ return load('https://www.gstatic.com/firebasejs/'+v+'/firebase-firestore-compat.js'); })
      .then(function(){ firebase.initializeApp(CONFIG.firebase); self.db=firebase.firestore(); }); },
  roomRef:function(cls){ return this.db.collection(CONFIG.collection).doc(cls); },
  teamRef:function(cls,id){ return this.roomRef(cls).collection('teams').doc(String(id)); },
  updateTeam:function(cls,id,fn){ var ref=this.teamRef(cls,id);
    return this.db.runTransaction(function(tx){ return tx.get(ref).then(function(s){ var t=s.exists?s.data():null; var nt=fn(clone(t));
      if(nt===undefined) return t; if(nt===null){ tx.delete(ref); return null; } tx.set(ref,storeDoc(nt)); return nt; }); }); },
  pushEvent:function(cls,text,kind){ var ref=this.roomRef(cls);
    return this.db.runTransaction(function(tx){ return tx.get(ref).then(function(s){ var r=s.exists?s.data():{events:[]};
      r.events=(r.events||[]).concat([{ts:Date.now(),text:text,kind:kind||''}]).slice(-40); tx.set(ref,r); }); }).catch(function(e){ console.warn(e); }); },
  watchTeam:function(cls,id,cb){ return this.teamRef(cls,id).onSnapshot(function(s){ cb(s.exists?s.data():null); }); },
  watchRoom:function(cls,cb){ var room={teams:{},events:[]};
    var u1=this.roomRef(cls).onSnapshot(function(s){ room.events=(s.exists&&s.data().events)||[]; cb(clone(room)); });
    var u2=this.roomRef(cls).collection('teams').onSnapshot(function(qq){ room.teams={}; qq.forEach(function(d){ room.teams[d.id]=d.data(); }); cb(clone(room)); });
    return function(){ u1(); u2(); }; },
  clearRoom:function(cls){ var self=this; return this.roomRef(cls).collection('teams').get().then(function(qq){ var b=self.db.batch(); qq.forEach(function(d){ b.delete(d.ref); }); b.delete(self.roomRef(cls)); return b.commit(); }); }
};

  vignette(g<=30); }

        var seatCells=SEATS.filter(function(s){return t.players[s];}).map(function(s){ var os=t.status==='play'?objsOfSeat(t,s,r):[]; var d=os.length&&os.every(function(o){return (t.prog[pkey(o,r)]||{}).done;}); return s+' '+esc(t.players[s].name)+' '+os.map(function(o){return OBJ[o].emoji;}).join('')+(d?' ✔':''); }).join('<br>');
        var st=t.status==='play'?'R'+(r+1)+' '+ROUNDS[r].name:t.status==='final'?'최종 LOOP':t.status==='done'?'✨ 탈출':'대기';
        return '<tr><td>'+esc(t.solo?('개인 '+t.players.A.name):t.id)+'</td><td>'+(t.solo?1:(t.n||Object.keys(t.players).length))+'명 → '+(t.objs||[]).map(function(o){return OBJ[o].emoji;}).join('')+'</td><td>'+st+'</td><td class="l">'+seatCells+'</td><td>'+(t.deaths||0)+'</td><td>'+w+' / '+h+'</td><td>'+tm+'</td>'
         +'<td>'+(t.status==='lobby'?'<button class="small" data-act="start" data-id="'+esc(t.id)+'">출발</button> ':'')+(t.status==='play'?'<button class="small alt" data-act="skip" data-id="'+esc(t.id)+'">다음 라운드</button> ':'')+'<button class="small red" data-act="del" data-id="'+esc(t.id)+'">삭제</button></td></tr>'; }).join(''):'<tr><td colspan="8" class="muted" style="padding:30px">아직 입장한 모둠이 없어요. 학생들에게 반 코드 <b>'+esc(cls)+'</b>를 알려 주세요.</td></tr>')
     +'</tbody></table></div>'
     +'<div class="row mt2" style="align-items:flex-start"><div class="lbl pad"><h3>❌ 많이 틀린 퍼즐</h3><div class="mt" style="font-size:14px;line-height:1.8">'+(Object.keys(mist).sort(function(a,b){return mist[b]-mist[a];}).slice(0,8).map(function(k){ return '<div>'+esc(stepLabel(k))+' — <b>'+mist[k]+'</b>회</div>'; }).join('')||'<span class="muted">아직 없음</span>')+'</div></div>'
     +'<div class="lbl pad"><h3>📝 인수인계 메모</h3><div class="mt" style="font-size:13px;line-height:1.7;max-height:260px;overflow:auto">'+(memos.map(function(m){return '<div>'+esc(m)+'</div>';}).join('')||'<span class="muted">아직 없음</span>')+'</div></div></div>'
     +'<div class="lbl pad mt2"><div style="display:flex;align-items:center;gap:10px"><h3>✊ 학생 다짐 (알게 된 점 · 깨달은 점 · 실천할 점)</h3><button class="small alt" id="bReflCsv" style="margin-left:auto">⬇ CSV 내려받기</button></div>'
     +(refls.length?'<div class="tblwrap mt"><table class="refltbl"><thead><tr><th>모둠</th><th>이름</th><th>📘 알게 된 점</th><th>💡 깨달은 점</th><th>✊ 실천할 점</th></tr></thead><tbody>'+refls.map(function(r){ return '<tr><td>'+esc(r.team)+'</td><td>'+esc(r.name)+'</td><td class="l">'+esc(r.learn)+'</td><td class="l">'+esc(r.realize)+'</td><td class="l">'+esc(r.act)+'</td></tr>'; }).join('')+'</tbody></table></div>':'<p class="muted mt">탈출한 학생이 다짐을 보내면 여기에 모여요.</p>')+'</div>'
     +'<div class="foot"><span class="ju" style="font-size:12px">인원이 2~4명이면 물건 수가 자동으로 2~4개 (2명: 🥤👕 · 3명: 🥤👕🪑 · 4명: 🥤👕🪑🍎)</span><button class="small red" id="bClear">이 반 기록 전체 삭제</button></div></div>';
    qa('[data-act]').forEach(function(b){ b.onclick=function(){ var id=b.dataset.id, a=b.dataset.act;
      if(a==='start') S.updateTeam(cls,id,startTeam).then(function(t){ flushEv(cls,t); });
      if(a==='del') askBox({title:id+' 기록을 삭제할까요?', ok:'삭제', cb:function(){ S.updateTeam(cls,id,function(){ return null; }); }});
      if(a==='skip') askBox({title:'현재 라운드를 넘길까요?', msg:'모든 물건을 완료 처리해요', ok:'넘기기', cb:function(){ S.updateTeam(cls,id,function(t){ if(!t||t.status!=='play') return undefined; var r=t.round; t.objs.forEach(function(o){ t.prog[pkey(o,r)]={step:99,done:true}; if(r<3&&!t.memos[pkey(o,r)]) t.memos[pkey(o,r)]={from:'선생님',text:'(선생님이 라운드를 넘겼어요)'}; }); return tryAdvance(t); }).then(function(t){ flushEv(cls,t); }); }}); }; });
    $('bReflCsv').onclick=function(){ var rows=[['반','모둠','이름','알게 된 점','깨달은 점','실천할 점','제출 시각']].concat((LOCAL.refls||[]).map(function(r){ return [cls,r.team,r.name,r.learn,r.realize,r.act,r.at?new Date(r.at).toLocaleString('ko-KR'):'']; }));
      var csv='\ufeff'+rows.map(function(r){ return r.map(function(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n');
      var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='TAG_다짐_'+cls+'.csv'; document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); },500); };
    $('bClear').onclick=function(){ askBox({title:cls+' 반의 기록을 모두 삭제할까요?', ok:'전체 삭제', cb:function(){ S.clearRoom(cls); }}); }; }); }

(function boot(){ ROUGH=''; bindFooter();
  var useFb = CONFIG.firebase && CONFIG.firebase.apiKey && CONFIG.firebase.projectId; S = useFb ? FireStore : LocalStore;
  $('modebar').textContent = useFb ? '' : '로컬 테스트 모드 — 같은 브라우저의 탭끼리만 연결돼요. 실제 수업은 index.html의 CONFIG.firebase를 채워 주세요.';
  S.init().catch(function(e){ console.warn('Firebase 실패, 로컬 모드', e); S=LocalStore; $('modebar').textContent='⚠️ 서버(Firebase)에 연결하지 못해 로컬 모드로 실행 중 — 인터넷 연결을 확인하고 새로고침해 주세요.'; return S.init(); }).then(function(){
    if(hasQ('tv')) return viewTV(); if(hasQ('teacher')) return viewTeacher(); viewHome(); var seen=false; try{ seen=sessionStorage.getItem('tag_intro')==='1'; }catch(e){} if(!seen&&!hasQ('nointro')) playIntro(); });
})();
